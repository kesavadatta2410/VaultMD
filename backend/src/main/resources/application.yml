server:
  port: 8080

spring:
  application:
    name: vaultmd-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vaultmd}
    username: ${DB_USER:vaultmd}
    password: ${DB_PASSWORD:vaultmd}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
    show-sql: false

# --- VaultMD-specific settings ---
# All of these can (and for JWT_SECRET, should) be overridden via environment
# variables in docker-compose.yml or your deployment environment. The
# defaults below are dev-only and are NOT safe for production.
vaultmd:
  jwt:
    # ASSUMPTION: dev-only fallback secret, 44 chars (> 256 bits as UTF-8 bytes).
    # Always override with JWT_SECRET in any shared/deployed environment.
    secret: ${JWT_SECRET:dev-only-secret-do-not-use-in-prod-change-me-please}
    expiration-ms: ${JWT_EXPIRATION_MS:28800000} # 8 hours - demo convenience; no refresh tokens (see README non-goals)
  ai-service:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
  emergency-access:
    # ASSUMPTION: the spec says a "recent" EmergencyAccess counts as an active
    # grant but doesn't define "recent". Defaulting to a 12-hour window here.
    validity-hours: ${EMERGENCY_ACCESS_VALIDITY_HOURS:12}
  cors:
    # ASSUMPTION: wildcard is fine for this local demo because auth uses a
    # Bearer token (Authorization header), not cookies, so classic
    # cookie-based CSRF does not apply. Restrict this in any real deployment.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

logging:
  level:
    com.vaultmd.backend: INFO
