name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ── Backend: Java / Maven ─────────────────────────────────
  backend-test:
    name: Backend Tests (Java 17 / Maven)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run backend tests
        working-directory: backend
        run: mvn -B test --no-transfer-progress

      - name: Upload Surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/

  # ── AI Service: Python / pytest ───────────────────────────
  ai-service-test:
    name: AI Service Tests (Python 3.11 / pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai-service/requirements.txt

      - name: Install dependencies
        working-directory: ai-service
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run AI service tests
        working-directory: ai-service
        run: pytest tests/ -v

  # ── Lint / format checks (optional but informative) ───────
  python-lint:
    name: Python Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        working-directory: ai-service
        # Run as non-blocking check (continue-on-error) so lint issues are
        # reported but don't block merges until the codebase is fully linted.
        run: ruff check app/ tests/ || true
